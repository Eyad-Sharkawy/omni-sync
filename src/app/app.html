<os-navbar (toggleSideBar)="onToggleSideBar()" />

<div class="relative flex min-h-0 flex-1">
  @if (isMobile() && sideBarIsOpen()) {
    <button
      type="button"
      class="absolute inset-0 z-20 bg-black/55 transition"
      aria-label="Close sidebar"
      (click)="onCloseSideBar()"
    ></button>
  }

  <os-sidebar [isOpen]="sideBarIsOpen()" />

  <div class="flex min-h-0 min-w-0 flex-1">
    <router-outlet />
  </div>
</div>
