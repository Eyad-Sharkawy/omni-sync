<aside
  class="bg-surface border-r-border flex w-(--width) shrink-0 flex-col overflow-hidden border-r transition-[width] duration-[0.25s] ease-[cubic-bezier(0.4,0,0.2,1)]"
  [attr.aria-hidden]="!isOpen()"
  [attr.inert]="!isOpen() ? '' : null"
>
  <span class="px-4 pt-4.5 pb-2 text-[9px] tracking-[2px] whitespace-nowrap uppercase">
    @if (!collapsed() || isMobile()) {
      Views
    }
  </span>
  <ul class="flex flex-col overflow-hidden">
    <li>
      <a
        routerLink="/kanban"
        routerLinkActive="active-link"
        class="flex items-center gap-3 overflow-hidden px-4 py-2 whitespace-nowrap"
      >
        <span class="flex items-center text-base" aria-hidden="true">⬡</span>
        @if (!collapsed() || isMobile()) {
          <span class="flex items-center">Board</span>
        }
      </a>

      <a
        routerLink="/calendar"
        routerLinkActive="active-link"
        class="item-center flex gap-3 overflow-hidden px-4 py-2 whitespace-nowrap"
      >
        <span class="flex items-center text-base" aria-hidden="true">◫</span>
        @if (!collapsed() || isMobile()) {
          <span class="flex items-center">Calendar</span>
        }
      </a>
    </li>
  </ul>

  <footer class="border-t-border mt-auto flex flex-col border-t py-2.5">
    @if (!isMobile()) {
      <button
        type="button"
        [title]="collapsed() ? 'Expand' : 'Collapse'"
        class="hover:text-secondary flex flex-1 cursor-pointer items-center gap-3 overflow-hidden px-4 py-2 whitespace-nowrap transition"
        (click)="onToggleCollapse()"
      >
        <span class="text-base transition" aria-hidden="true">◁</span>
        @if (!collapsed()) {
          <span class="transition">Collapse</span>
        }
      </button>
    } @else if (!auth.currentUser()) {
      <button
        class="text-primary bg-os-indigo cursor-pointer rounded-lg px-6 py-3 font-mono text-sm font-medium tracking-[0.3px] transition hover:opacity-85"
        (click)="openLoginPopup()"
      >
        Sign in
      </button>
    }
  </footer>
</aside>

@if (isLoginPopupOpen()) {
  <os-login-popup (closed)="closeLoginPopup()" />
}
