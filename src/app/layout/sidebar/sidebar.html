<aside
  class="bg-surface border-r-border flex w-[var(--width)] shrink-0 flex-col overflow-hidden border-r transition-[width] duration-[0.25s] ease-[cubic-bezier(0.4,0,0.2,1)]"
  [attr.aria-hidden]="!isOpen()"
  [attr.inert]="!isOpen() ? '' : null"
>
  <span class="px-4 pt-4.5 pb-2 text-[9px] tracking-[2px] whitespace-nowrap uppercase">
    @if (!collapsed()) {
      Views
    }
  </span>
  <ul class="flex flex-col overflow-hidden">
    <li>
      <a
        routerLink="/kanban"
        routerLinkActive="active-link"
        class="flex items-center gap-3 overflow-hidden px-4 py-2 whitespace-nowrap"
      >
        <span class="text-base" aria-hidden="true">⬡</span>
        @if (!collapsed()) {
          <span>Board</span>
        }
      </a>
    </li>
  </ul>
  @if (!isMobile()) {
    <footer class="border-t-border mt-auto flex flex-col border-t py-2.5">
      <button
        type="button"
        [title]="collapsed() ? 'Expand' : 'Collapse'"
        class="flex flex-1 cursor-pointer items-center gap-3 overflow-hidden px-4 py-2 whitespace-nowrap"
        (click)="onToggleCollapse()"
      >
        <span class="text-base" aria-hidden="true">◁</span>
        @if (!collapsed()) {
          <span>Collapse</span>
        }
      </button>
    </footer>
  }
</aside>
