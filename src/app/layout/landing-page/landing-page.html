<main
  class="relative z-1 flex min-h-0 flex-1 flex-col items-center justify-center overflow-x-hidden overflow-y-auto px-5 pt-9 pb-7 text-center sm:px-8 sm:pt-12 sm:pb-9 md:px-12 md:pt-15 md:pb-10"
>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <h2
    class="mb-5 max-w-200 text-[clamp(34px,9vw,80px)] leading-[1.05] font-extrabold tracking-tight sm:mb-6 sm:text-[clamp(42px,7vw,80px)]"
  >
    Your team's work,
    <br />
    <span
      class="bg-gradient-to-br from-[#6c63ff] via-[#a78bfa] to-[#54a0ff] bg-clip-text text-transparent"
      >perfectly in sync</span
    >
  </h2>

  <p class="text-secondary mb-7 max-w-120 font-mono text-sm leading-[1.7] sm:mb-10">
    Omni Sync brings boards, timelines, calendars and docs into one unified workspace — built for
    teams who ship fast.
  </p>

  <div class="flex items-center gap-4">
    <a
      routerLink="/kanban"
      class="bg-os-indigo shadow-btn-glow mb-8 cursor-pointer rounded-lg px-7 py-3.5 font-mono text-sm font-medium tracking-[0.3px] transition hover:opacity-85 sm:mb-16"
    >
      Open Kanban
    </a>

    <a
      routerLink="/calendar"
      class="bg-os-indigo shadow-btn-glow mb-8 cursor-pointer rounded-lg px-7 py-3.5 font-mono text-sm font-medium tracking-[0.3px] transition hover:opacity-85 sm:mb-16"
    >
      Open Calendar
    </a>
  </div>

  <div class="flex flex-wrap items-center justify-center gap-2.5">
    <div
      class="text-secondary bg-surface border-border flex items-center gap-1.5 rounded-[20px] border px-3.5 py-1.5 text-sm tracking-[0.3px]"
    >
      <span class="bg-os-indigo shadow-os-indigo h-1 w-1 rounded-full" aria-hidden="true"></span>
      <span>Kanban Board</span>
    </div>

    <div
      class="text-secondary bg-surface border-border flex items-center gap-1.5 rounded-[20px] border px-3.5 py-1.5 text-sm tracking-[0.3px]"
    >
      <span class="bg-os-mint shadow-os-indigo h-1 w-1 rounded-full" aria-hidden="true"></span>
      <span>Calendar</span>
    </div>
  </div>
</main>
