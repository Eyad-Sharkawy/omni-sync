<nav
  class="bg-bg border-b-border flex min-h-[4.75rem] shrink-0 items-center gap-5 border-b-2 px-10 py-5 text-white"
>
  @if (isMobile() && !isLandingPage()) {
    <button
      type="button"
      title="Expand side bar"
      class="cursor-pointer transition"
      (click)="onToggleSideBar()"
    >
      <img ngSrc="/images/icons/burger-menu.svg" alt="Expand side bar" width="25" height="25" />
    </button>
  }

  <a routerLink="/" class="flex items-center gap-4" aria-label="Omni Sync Home">
    <img
      ngSrc="/images/icons/omni-sync-32.svg"
      class="h-9 w-9 rounded-md"
      alt="Omni Sync Logo"
      aria-hidden="true"
      height="32"
      width="32"
    />
    <h1 class="text-primary text-[20px] font-bold">Omni Sync</h1>
  </a>

  <div class="ml-auto flex items-center gap-3 font-mono">
    @if (auth.currentUser()) {
      <button
        type="button"
        [cdkMenuTriggerFor]="profileMenu"
        class="border-border bg-os-indigo/25 text-primary flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-full border text-xs font-semibold tracking-wide transition hover:opacity-90"
        title="Account"
        aria-label="Open account menu"
        aria-haspopup="menu"
      >
        {{ avatarLabel() }}
      </button>
      <ng-template #profileMenu>
        <div
          cdkMenu
          class="border-border bg-surface2 text-primary mt-1 min-w-[11rem] rounded-lg border py-1 font-mono text-sm shadow-lg"
        >
          <a
            routerLink="/profile"
            cdkMenuItem
            class="text-primary hover:bg-surface3 block cursor-pointer px-3 py-2 no-underline transition"
          >
            Edit profile
          </a>
          <button
            type="button"
            cdkMenuItem
            class="text-primary hover:bg-surface3 block w-full cursor-pointer px-3 py-2 text-left transition"
            (click)="auth.logout()"
          >
            Sign out
          </button>
        </div>
      </ng-template>
    } @else if (isLandingPage() || !isMobile()) {
      <button
        class="bg-os-indigo cursor-pointer rounded-lg px-6 py-3 font-mono text-sm font-medium tracking-[0.3px] transition hover:opacity-85"
        (click)="openLoginPopup()"
      >
        Sign in
      </button>
    }
  </div>
</nav>

@if (isLoginPopupOpen()) {
  <os-login-popup (closed)="closeLoginPopup()" />
}
