<div body class="bg-surface2 border-border cursor-grab rounded-lg p-3.5">
  <div class="mb-2.5 flex items-center justify-between">
    <div class="flex items-center justify-center gap-1.5">
      <span class="h-1.5 w-1.5 rounded-full bg-[var(--priority)]"></span>

      <span class="text-[0.625rem] tracking-[1px] text-[var(--priority)] uppercase">
        {{ taskPriority() }}
      </span>
    </div>

    <div class="flex gap-2">
      <button
        type="button"
        title="Delete task"
        (click)="onDelete()"
        class="hover:bg-surface3 cursor-pointer rounded-md p-0.5"
      >
        <img ngSrc="/images/icons/trash-can.svg" alt="Delete Task" width="15" height="15" />
      </button>

      <button
        type="button"
        title="Edit task"
        (click)="onEdit()"
        class="hover:bg-surface3 cursor-pointer rounded-sm p-0.5"
      >
        <img ngSrc="/images/icons/edit-button.svg" alt="Edit task" width="15" height="15" />
      </button>
    </div>
  </div>

  <h4 class="mb-2.5 text-sm leading-[1.4] font-semibold">
    <ng-content select="Message" />
  </h4>

  @if (taskTags().length !== 0) {
    <div class="mb-3 flex flex-wrap gap-1.5">
      <ng-content select="os-task-tag" />
    </div>
  }

  <div class="flex items-center justify-between">
    <p class="text-muted font-mono text-sm">
      <ng-content select="Date" />
    </p>
  </div>
</div>
