<os-modal
  [title]="(mode() === 'login' ? 'Log in ' : 'Sign in ') + 'to Omni Sync'"
  badge="Authentication"
  color="indigo"
  (closed)="closed.emit()"
>
  <div class="px-6 pt-5 pb-6">
    <div class="mb-5 grid grid-cols-2 rounded-lg border border-zinc-700 p-1">
      <button
        type="button"
        class="cursor-pointer rounded-md px-3 py-2 text-xs font-semibold transition"
        [class.bg-os-indigo]="mode() === 'login'"
        [class.text-white]="mode() === 'login'"
        [class.text-secondary]="mode() !== 'login'"
        [disabled]="isSubmitting()"
        (click)="setMode('login')"
      >
        Log in
      </button>
      <button
        type="button"
        class="cursor-pointer rounded-md px-3 py-2 text-xs font-semibold transition"
        [class.bg-os-indigo]="mode() === 'signup'"
        [class.text-white]="mode() === 'signup'"
        [class.text-secondary]="mode() !== 'signup'"
        [disabled]="isSubmitting()"
        (click)="setMode('signup')"
      >
        Sign Up
      </button>
    </div>

    <form class="space-y-3" [formGroup]="authForm" (ngSubmit)="submitWithEmail()">
      <label class="block">
        <span class="text-secondary mb-1 block text-xs">Email</span>
        <input
          type="email"
          formControlName="email"
          class="bg-surface2 border-border text-primary w-full rounded-md border px-3 py-2 text-sm outline-none focus:border-indigo-400"
          [placeholder]="mode() === 'login' ? 'Enter your email' : 'you@example.com'"
        />
        @for (error of emailErrors; track error) {
          <p class="mt-1 text-xs text-red-400">{{ error }}</p>
        }
      </label>

      <label class="block">
        <span class="text-secondary mb-1 block text-xs">Password</span>
        <div class="relative">
          <input
            [type]="isPasswordVisible() ? 'text' : 'password'"
            formControlName="password"
            class="bg-surface2 border-border text-primary w-full rounded-md border px-3 py-2 pr-17 text-sm outline-none focus:border-indigo-400"
            [placeholder]="
              mode() === 'login' ? 'Enter your password' : 'At least 8 chars, mixed types'
            "
          />
          <button
            type="button"
            class="text-secondary hover:text-primary absolute top-1/2 right-3 -translate-y-1/2 cursor-pointer transition"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            @if (isPasswordVisible()) {
              <svg
                viewBox="0 0 24 24"
                class="h-4 w-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 3l18 18"></path>
                <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
                <path
                  d="M9.88 5.08A10.94 10.94 0 0 1 12 4c5 0 9.27 3.11 11 8-0.73 2.06-2 3.8-3.54 5.07"
                ></path>
                <path
                  d="M6.61 6.61C4.62 7.91 3.1 9.79 2 12c1.73 4.89 6 8 10 8 1.43 0 2.8-0.34 4.05-0.95"
                ></path>
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                class="h-4 w-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M2 12s3.5-8 10-8 10 8 10 8-3.5 8-10 8-10-8-10-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
        @for (error of passwordErrors; track error) {
          <p class="mt-1 text-xs text-red-400">{{ error }}</p>
        }

        @if (mode() === "login") {
          <div class="mt-2 flex items-center gap-3">
            <button
              type="button"
              class="text-os-indigo cursor-pointer text-xs hover:underline disabled:cursor-not-allowed disabled:opacity-60"
              [disabled]="isSubmitting()"
              (click)="forgotPassword()"
            >
              Forgot password?
            </button>
            <button
              type="button"
              class="text-os-indigo cursor-pointer text-xs hover:underline disabled:cursor-not-allowed disabled:opacity-60"
              [disabled]="isSubmitting()"
              (click)="sendMagicLink()"
            >
              Email me a sign-in link
            </button>
          </div>
        }
      </label>

      @if (mode() === "signup") {
        <label class="block">
          <span class="text-secondary mb-1 block text-xs">Confirm password</span>
          <div class="relative">
            <input
              [type]="isConfirmPasswordVisible() ? 'text' : 'password'"
              formControlName="confirmPassword"
              class="bg-surface2 border-border text-primary w-full rounded-md border px-3 py-2 pr-17 text-sm outline-none focus:border-indigo-400"
              placeholder="Re-enter your password"
            />
            <button
              type="button"
              class="text-secondary hover:text-primary absolute top-1/2 right-3 -translate-y-1/2 cursor-pointer transition"
              [attr.aria-label]="
                isConfirmPasswordVisible() ? 'Hide confirm password' : 'Show confirm password'
              "
              (click)="toggleConfirmPasswordVisibility()"
            >
              @if (isConfirmPasswordVisible()) {
                <svg
                  viewBox="0 0 24 24"
                  class="h-4 w-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M3 3l18 18"></path>
                  <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
                  <path
                    d="M9.88 5.08A10.94 10.94 0 0 1 12 4c5 0 9.27 3.11 11 8-0.73 2.06-2 3.8-3.54 5.07"
                  ></path>
                  <path
                    d="M6.61 6.61C4.62 7.91 3.1 9.79 2 12c1.73 4.89 6 8 10 8 1.43 0 2.8-0.34 4.05-0.95"
                  ></path>
                </svg>
              } @else {
                <svg
                  viewBox="0 0 24 24"
                  class="h-4 w-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M2 12s3.5-8 10-8 10 8 10 8-3.5 8-10 8-10-8-10-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
          @for (error of confirmPasswordErrors; track error) {
            <p class="mt-1 text-xs text-red-400">{{ error }}</p>
          }
        </label>
      }

      @if (errorMessage()) {
        <p class="text-sm text-red-400">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p class="text-sm text-emerald-400">{{ successMessage() }}</p>
      }

      <button
        type="submit"
        class="bg-os-indigo hover:bg-os-indigo/85 mt-2 w-full cursor-pointer rounded-lg px-4 py-3 text-sm font-semibold transition disabled:cursor-not-allowed disabled:opacity-70"
        [disabled]="isSubmitting()"
      >
        {{
          isSubmitting()
            ? mode() === "signup"
              ? "Creating account..."
              : "Signing in..."
            : mode() === "signup"
              ? "Create account"
              : "Sign in with email"
        }}
      </button>
    </form>

    <div class="my-4 flex items-center gap-3">
      <span class="h-px flex-1 bg-zinc-700"></span>
      <span class="text-secondary text-xs">or</span>
      <span class="h-px flex-1 bg-zinc-700"></span>
    </div>

    <button
      type="button"
      class="bg-os-indigo/30 hover:bg-os-indigo/45 flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg px-4 py-3 text-sm font-semibold transition disabled:cursor-not-allowed disabled:opacity-70"
      [disabled]="isSubmitting()"
      (click)="signInWithGoogle()"
    >
      <img src="/images/icons/google-logo.svg" alt="" aria-hidden="true" class="h-4 w-4" />
      Continue with Google
    </button>
  </div>
</os-modal>
