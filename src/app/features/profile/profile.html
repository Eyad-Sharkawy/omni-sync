<main class="text-primary mx-auto max-w-lg px-8 py-12">
  <h1 class="text-secondary mb-2 text-2xl font-bold">Your profile</h1>
  <p class="text-muted mb-8 text-sm">
    Choose a unique username and your name. Other users can share boards with you using your
    username.
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
      <label for="profile-username" class="text-secondary text-sm font-medium">Username</label>
      <input
        id="profile-username"
        formControlName="username"
        type="text"
        autocomplete="username"
        class="border-border bg-surface text-primary rounded-lg border px-3 py-2"
        placeholder="your_name"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="profile-first" class="text-secondary text-sm font-medium">First name</label>
      <input
        id="profile-first"
        formControlName="firstName"
        type="text"
        autocomplete="given-name"
        class="border-border bg-surface text-primary rounded-lg border px-3 py-2"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="profile-last" class="text-secondary text-sm font-medium">Last name</label>
      <input
        id="profile-last"
        formControlName="lastName"
        type="text"
        autocomplete="family-name"
        class="border-border bg-surface text-primary rounded-lg border px-3 py-2"
      />
    </div>

    @if (saveError()) {
      <p class="text-danger text-sm">{{ saveError() }}</p>
    }
    @if (saveOk()) {
      <p class="text-os-mint text-sm">Profile saved.</p>
    }

    <button
      type="submit"
      class="bg-os-indigo hover:opacity-90 mt-2 cursor-pointer rounded-lg py-3 font-medium transition"
    >
      Save
    </button>
  </form>
</main>
